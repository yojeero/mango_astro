# -*- CONf -*-

# Shell configuration
shell=/bin/bash
term=foot
login-shell=no

app-id=foot
title=foot
locked-title=no

font=JetBrainsMono Nerd Font:size=11

[main]
pad=20x20

[bell]
urgent=no
notify=no
command-focused=no

[scrollback]
lines=1500
multiplier=3.0
indicator-position=relative

[url]
launch=xdg-open ${url}
label-letters=sadfjklewcmpgh
osc8-underline=url-mode

[cursor]
style=beam
blink=yes

[mouse]
hide-when-typing=no
alternate-scroll-mode=no

[colors-dark]
# Solarized Dark Palette
foreground=839496  # base0 (светло-серый текст)
background=002b36  # base03 (очень темный сине-зеленый фон)

# Normal/regular colors (color palette 0-7)
regular0=073642  # black (base02)
regular1=dc322f  # red
regular2=859900  # green
regular3=b58900  # yellow
regular4=268bd2  # blue
regular5=d33682  # magenta
regular6=2aa198  # cyan
regular7=eee8d5  # white (base2)

## Bright colors (color palette 8-15)
bright0=002b36   # bright black (base03)
bright1=cb4b16   # bright red (orange)
bright2=586e75   # bright green (base01)
bright3=657b83   # bright yellow (base00)
bright4=839496   # bright blue (base0)
bright5=6c71c4   # bright magenta (violet)
bright6=93a1a1   # bright cyan (base1)
bright7=fdf6e3   # bright white (base3)

[csd]

[key-bindings]
scrollback-up-page=Shift+Page_Up
scrollback-down-page=Shift+Page_Down
clipboard-copy=Control+c XF86Copy
clipboard-paste=Control+v XF86Paste
primary-paste=Shift+Insert

[search-bindings]

[url-bindings]

[mouse-bindings]



